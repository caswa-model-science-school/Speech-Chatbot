<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASWA-EdVisor | CMSS Jacobabad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); }

    @keyframes rotate-rays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }

    @keyframes speech-pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(244, 63, 94, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    .living-mic-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 280px;
      height: 280px;
    }

    .mic-ray {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(59, 130, 246, 0.4);
      animation: rotate-rays 4s linear infinite;
    }

    .mic-ray:nth-child(2) {
      animation-duration: 6s;
      border-top-color: rgba(147, 197, 253, 0.3);
      width: 110%;
      height: 110%;
    }

    .mic-ray:nth-child(3) {
      animation-duration: 8s;
      border-top-color: rgba(30, 58, 138, 0.2);
      width: 120%;
      height: 120%;
    }

    .mic-pulse-circle {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: breathe 3s ease-in-out infinite;
    }

    .status-listening .mic-ray {
      animation-duration: 2s;
      border-top-color: rgba(59, 130, 246, 0.6);
    }

    .status-speaking .mic-ray {
      animation-duration: 1.5s;
      border-top-color: rgba(244, 63, 94, 0.6);
    }

    .status-thinking .mic-ray {
      animation-duration: 10s;
      opacity: 0.5;
    }

    .status-error .mic-ray {
      animation-duration: 0.5s;
      border-top-color: rgba(244, 63, 94, 1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
